name: Bug report
description: Unbound showed an error, crashed, or a converted item came out wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach a mailbox file (OST, PST or MBOX), a converted PST or the full conversion log.** They hold
        email, names and addresses, and anything posted here is public. Describe what you saw instead, and copy
        only the counts and error lines from the log, with folder names, subjects and addresses removed.
        Security problems go to Security > Report a vulnerability, not here.
  - type: input
    id: version
    attributes:
      label: Unbound version
      description: Shown in the window's header, next to Check for updates.
      placeholder: "1.3.6"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What was being converted?
      options:
        - An OST from Exchange or Microsoft 365
        - An OST from an IMAP account
        - A PST
        - An Apple Mail export (MBOX)
    validations:
      required: true
  - type: input
    id: outlook
    attributes:
      label: Outlook version on the PC doing the conversion
      description: In Outlook, File > Office Account > About Outlook. Unbound needs Outlook Classic.
      placeholder: "Microsoft 365 Apps, Outlook Classic, version 2410"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the message Unbound showed, and roughly how many items the mailbox has.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: From the log
      description: >
        The counts ("Copied", "Skipped", "Failed"), the "Where the time went" line and the error lines, from
        "<name> - Unbound log.txt" next to the PST. Remove folder names, subjects and addresses before pasting.
      render: text
